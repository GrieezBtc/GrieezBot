<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GrieezBot | GrieeForge</title>
  <meta
    name="description"
    content="GrieezBot is an AI assistant created by GrieeForge for coding, debugging, daily activities, and practical assistance."
  >
  <meta name="theme-color" content="#4169e1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    :root {
      --accent: #4169e1;
      --accent-hover: #3158cf;
      --accent-dark: #2446a8;
      --accent-soft: #e9efff;
      --accent-softer: #f2f5ff;

      --background: #f8f6ef;
      --surface: #fffefa;
      --surface-solid: #ffffff;
      --surface-muted: #f3f1ea;

      --text: #172033;
      --text-soft: #626a7a;
      --text-faint: #8c93a1;

      --border: #e7e3da;
      --danger: #d94242;
      --success: #25965a;

      --user-bubble: #e8eeff;
      --code-background: #111827;
      --code-header: #1d2738;
      --code-text: #e5edf8;

      --sidebar-width: 286px;
      --topbar-height: 74px;
      --composer-width: 880px;

      --shadow-sm: 0 4px 14px rgba(31, 42, 68, 0.06);
      --shadow-md: 0 14px 40px rgba(31, 42, 68, 0.11);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--background);
      color: var(--text);
      font-family: "Inter", sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(65, 105, 225, 0.24);
      outline-offset: 2px;
    }

    .app {
      display: flex;
      height: 100%;
    }

    .sidebar {
      position: relative;
      z-index: 40;
      display: flex;
      flex: 0 0 var(--sidebar-width);
      flex-direction: column;
      width: var(--sidebar-width);
      min-width: 0;
      border-right: 1px solid var(--border);
      background: #f0eee7;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .new-chat-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 9px;
      padding: 12px 15px;
      border: 0;
      border-radius: 13px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition:
        background 0.18s ease,
        transform 0.18s ease;
    }

    .new-chat-button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .history-heading {
      margin: 22px 18px 9px;
      color: var(--text-faint);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 18px;
    }

    .history-empty {
      margin: 12px 9px;
      color: var(--text-faint);
      font-size: 0.83rem;
      line-height: 1.5;
    }

    .history-item {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 5px;
      margin-bottom: 4px;
      border-radius: 11px;
      transition: background 0.18s ease;
    }

    .history-item:hover,
    .history-item.active {
      background: rgba(255, 255, 255, 0.72);
    }

    .history-open {
      display: flex;
      flex: 1;
      min-width: 0;
      align-items: center;
      gap: 9px;
      padding: 11px 6px 11px 10px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .history-open i {
      color: var(--text-faint);
      font-size: 0.88rem;
    }

    .history-title {
      overflow: hidden;
      color: var(--text-soft);
      font-size: 0.86rem;
      font-weight: 600;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-delete {
      width: 34px;
      height: 34px;
      margin-right: 5px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text-faint);
      cursor: pointer;
      opacity: 0;
      transition:
        opacity 0.18s ease,
        color 0.18s ease,
        background 0.18s ease;
    }

    .history-item:hover .history-delete,
    .history-delete:focus-visible {
      opacity: 1;
    }

    .history-delete:hover {
      background: #ffe8e8;
      color: var(--danger);
    }

    .sidebar-footer {
      padding: 15px 18px;
      border-top: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 0.75rem;
      line-height: 1.5;
    }

    .sidebar-overlay {
      position: fixed;
      z-index: 35;
      inset: 0;
      display: none;
      background: rgba(17, 24, 39, 0.38);
      backdrop-filter: blur(2px);
    }

    .main {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      height: 100%;
    }

    .topbar {
      position: relative;
      z-index: 30;
      display: flex;
      flex: 0 0 var(--topbar-height);
      align-items: center;
      min-height: var(--topbar-height);
      gap: 13px;
      padding: 0 23px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 254, 250, 0.94);
      backdrop-filter: blur(15px);
      box-shadow: 0 2px 12px rgba(31, 42, 68, 0.04);
    }

    .menu-button {
      display: none;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      cursor: pointer;
    }

    .menu-button:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .avatar {
      position: relative;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 50%;
      background: var(--accent);
    }

    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: white;
      font-weight: 800;
      text-transform: uppercase;
    }

    .avatar.image-failed img {
      display: none;
    }

    .avatar.image-failed .avatar-fallback {
      display: flex;
    }

    .topbar-avatar {
      width: 46px;
      height: 46px;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .topbar-avatar .avatar-fallback {
      font-size: 1.05rem;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-name {
      overflow: hidden;
      margin: 0;
      font-size: 1.17rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
      color: var(--text-soft);
      font-size: 0.74rem;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(37, 150, 90, 0.13);
    }

    .conversation {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .welcome-screen {
      display: flex;
      min-height: 100%;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 162px;
    }

    .welcome-content {
      width: min(760px, 100%);
      text-align: center;
    }

    .welcome-avatar {
      width: 108px;
      height: 108px;
      margin: 0 auto 24px;
      box-shadow:
        0 0 0 7px var(--accent-soft),
        var(--shadow-md);
    }

    .welcome-avatar .avatar-fallback {
      font-size: 2.2rem;
    }

    .welcome-content h2 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.055em;
    }

    .welcome-content h2 span {
      color: var(--accent);
    }

    .welcome-copy {
      max-width: 630px;
      margin: 14px auto 30px;
      color: var(--text-soft);
      font-size: 1rem;
      line-height: 1.7;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      text-align: left;
    }

    .suggestion-card {
      display: flex;
      align-items: flex-start;
      min-height: 106px;
      gap: 13px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition:
        border-color 0.18s ease,
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .suggestion-card:hover {
      transform: translateY(-2px);
      border-color: rgba(65, 105, 225, 0.42);
      box-shadow: var(--shadow-md);
    }

    .suggestion-icon {
      display: grid;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 11px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .suggestion-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .suggestion-card span {
      color: var(--text-soft);
      font-size: 0.8rem;
      line-height: 1.45;
    }

    .messages {
      display: none;
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 32px 24px 180px;
    }

    .conversation.has-messages .welcome-screen {
      display: none;
    }

    .conversation.has-messages .messages {
      display: block;
    }

    .message-row {
      display: flex;
      width: 100%;
      margin-bottom: 25px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      align-items: flex-start;
      gap: 12px;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      margin-top: 2px;
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .message-avatar .avatar-fallback {
      font-size: 0.82rem;
    }

    .message-stack {
      max-width: min(760px, calc(100% - 48px));
    }

    .user .message-stack {
      max-width: min(680px, 86%);
    }

    .message-bubble {
      overflow-wrap: anywhere;
      font-size: 0.94rem;
      line-height: 1.72;
    }

    .user .message-bubble {
      padding: 12px 16px;
      border: 1px solid rgba(65, 105, 225, 0.12);
      border-radius: 18px 18px 4px 18px;
      background: var(--user-bubble);
      white-space: pre-wrap;
      box-shadow: var(--shadow-sm);
    }

    .assistant .message-bubble {
      padding: 2px 2px 0;
    }

    .message-bubble > :first-child {
      margin-top: 0;
    }

    .message-bubble > :last-child {
      margin-bottom: 0;
    }

    .message-bubble p {
      margin: 0 0 13px;
    }

    .message-bubble h1,
    .message-bubble h2,
    .message-bubble h3,
    .message-bubble h4,
    .message-bubble h5,
    .message-bubble h6 {
      margin: 20px 0 9px;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .message-bubble h1 {
      font-size: 1.45rem;
    }

    .message-bubble h2 {
      font-size: 1.27rem;
    }

    .message-bubble h3 {
      font-size: 1.12rem;
    }

    .message-bubble ul,
    .message-bubble ol {
      margin: 7px 0 14px;
      padding-left: 24px;
    }

    .message-bubble li {
      margin: 5px 0;
    }

    .message-bubble a {
      color: var(--accent);
      font-weight: 600;
    }

    .message-bubble code:not(.code-content code) {
      padding: 0.16em 0.42em;
      border: 1px solid rgba(65, 105, 225, 0.13);
      border-radius: 5px;
      background: var(--accent-softer);
      color: var(--accent-dark);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.88em;
    }

    .code-block {
      overflow: hidden;
      margin: 15px 0;
      border: 1px solid #263247;
      border-radius: 12px;
      background: var(--code-background);
      box-shadow: var(--shadow-sm);
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      background: var(--code-header);
      color: #bfc9d8;
      font-size: 0.73rem;
      font-weight: 700;
    }

    .code-language {
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: capitalize;
      white-space: nowrap;
    }

    .code-copy-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #d4dbea;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    .code-copy-button:hover {
      background: rgba(255, 255, 255, 0.09);
      color: white;
    }

    .code-content {
      overflow-x: auto;
      margin: 0;
      padding: 15px;
      color: var(--code-text);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.82rem;
      line-height: 1.65;
      tab-size: 2;
      white-space: pre;
    }

    .action-bar {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-top: 8px;
      color: var(--text-faint);
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 31px;
      height: 31px;
      gap: 6px;
      padding: 0 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font-size: 0.76rem;
      cursor: pointer;
      transition:
        background 0.18s ease,
        color 0.18s ease;
    }

    .action-button:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .action-button.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .message-time {
      margin: 0 6px 0 4px;
      font-size: 0.71rem;
      white-space: nowrap;
    }

    .typing-bubble {
      display: flex;
      align-items: center;
      min-height: 38px;
      gap: 5px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: typing-bounce 1.2s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing-bounce {
      0%,
      60%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-5px);
      }
    }

    .error-message {
      color: var(--danger);
    }

    .composer-shell {
      position: absolute;
      z-index: 25;
      right: 0;
      bottom: 0;
      left: var(--sidebar-width);
      padding: 22px 20px 13px;
      background:
        linear-gradient(
          to bottom,
          rgba(248, 246, 239, 0),
          rgba(248, 246, 239, 0.92) 22%,
          var(--background) 48%
        );
      transition: left 0.25s ease;
      pointer-events: none;
    }

    .composer {
      width: min(var(--composer-width), 100%);
      margin: 0 auto;
      pointer-events: auto;
    }

    .input-container {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 9px 9px 9px 17px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--surface-solid);
      box-shadow: var(--shadow-md);
      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .input-container:focus-within {
      border-color: rgba(65, 105, 225, 0.52);
      box-shadow:
        0 0 0 4px rgba(65, 105, 225, 0.09),
        var(--shadow-md);
    }

    #messageInput {
      flex: 1;
      max-height: 180px;
      min-height: 24px;
      padding: 6px 0;
      resize: none;
      overflow-y: auto;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 0.94rem;
      line-height: 1.5;
    }

    #messageInput::placeholder {
      color: #9ca1ac;
    }

    .send-button {
      display: grid;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      cursor: pointer;
      transition:
        background 0.18s ease,
        transform 0.18s ease,
        opacity 0.18s ease;
    }

    .send-button:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.04);
    }

    .send-button:disabled {
      cursor: not-allowed;
      opacity: 0.38;
    }

    .disclaimer {
      margin: 8px 0 0;
      color: var(--text-faint);
      font-size: 0.7rem;
      text-align: center;
    }

    @media (max-width: 800px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(var(--sidebar-width), 86vw);
        transform: translateX(-105%);
        box-shadow: var(--shadow-md);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.visible {
        display: block;
      }

      .menu-button {
        display: grid;
        place-items: center;
      }

      .topbar {
        padding: 0 14px;
      }

      .composer-shell {
        left: 0;
        padding-right: 12px;
        padding-left: 12px;
      }

      .messages {
        padding-right: 15px;
        padding-left: 15px;
      }

      .welcome-screen {
        padding-right: 16px;
        padding-left: 16px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      :root {
        --topbar-height: 67px;
      }

      .topbar-avatar {
        width: 41px;
        height: 41px;
      }

      .brand-name {
        font-size: 1.04rem;
      }

      .welcome-screen {
        align-items: flex-start;
        padding-top: 42px;
      }

      .welcome-avatar {
        width: 86px;
        height: 86px;
      }

      .welcome-copy {
        margin-bottom: 22px;
        font-size: 0.9rem;
      }

      .suggestion-card {
        min-height: 0;
        padding: 14px;
      }

      .message-row.assistant {
        gap: 9px;
      }

      .message-avatar {
        width: 32px;
        height: 32px;
      }

      .message-stack {
        max-width: calc(100% - 41px);
      }

      .user .message-stack {
        max-width: 90%;
      }

      .message-bubble {
        font-size: 0.9rem;
      }

      .action-bar {
        flex-wrap: wrap;
      }

      .input-container {
        border-radius: 21px;
      }

      .send-button {
        width: 39px;
        height: 39px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
      <div class="sidebar-header">
        <button class="new-chat-button" id="newChatButton" type="button">
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
          <span>New chat</span>
        </button>
      </div>

      <h2 class="history-heading">Recent chats</h2>
      <div class="chat-history" id="chatHistory"></div>

      <div class="sidebar-footer">
        GrieezBot by <strong>GrieeForge</strong>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main">
      <header class="topbar">
        <button
          class="menu-button"
          id="menuButton"
          type="button"
          aria-label="Open chat history"
          aria-expanded="false"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

        <div class="avatar topbar-avatar">
          <img
            src="https://res.cloudinary.com/dqqyvozdw/image/upload/v1794829406/lxzzqilpwcoxhypl940a.jpg"
            alt="GrieezBot"
          >
          <span class="avatar-fallback" aria-hidden="true">G</span>
        </div>

        <div class="brand-copy">
          <h1 class="brand-name">GrieezBot</h1>
          <div class="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span>Online</span>
          </div>
        </div>
      </header>

      <section class="conversation" id="conversation" aria-live="polite">
        <div class="welcome-screen">
          <div class="welcome-content">
            <div class="avatar welcome-avatar">
              <img
                src="https://res.cloudinary.com/dqqyvozdw/image/upload/v1794829406/lxzzqilpwcoxhypl940a.jpg"
                alt="GrieezBot"
              >
              <span class="avatar-fallback" aria-hidden="true">G</span>
            </div>

            <h2>Hello, I'm <span>GrieezBot</span></h2>

            <p class="welcome-copy">
              Your practical assistant for coding, debugging, daily activities,
              problem-solving, and clear step-by-step help.
            </p>

            <div class="suggestions">
              <button
                class="suggestion-card"
                type="button"
                data-prompt="Help me plan and build a small JavaScript project step by step."
              >
                <span class="suggestion-icon">
                  <i class="fa-solid fa-code" aria-hidden="true"></i>
                </span>
                <span>
                  <strong>Build a coding project</strong>
                  Plan the structure and create clean, practical code.
                </span>
              </button>

              <button
                class="suggestion-card"
                type="button"
                data-prompt="Help me debug an error. Tell me what details and code you need."
              >
                <span class="suggestion-icon">
                  <i class="fa-solid fa-bug" aria-hidden="true"></i>
                </span>
                <span>
                  <strong>Debug an error</strong>
                  Find the likely cause and work through a fix.
                </span>
              </button>

              <button
                class="suggestion-card"
                type="button"
                data-prompt="Help me create a realistic and organized plan for my day."
              >
                <span class="suggestion-icon">
                  <i class="fa-solid fa-calendar-check" aria-hidden="true"></i>
                </span>
                <span>
                  <strong>Plan my day</strong>
                  Turn your priorities into a manageable daily plan.
                </span>
              </button>

              <button
                class="suggestion-card"
                type="button"
                data-prompt="Explain a difficult technical topic to me in simple terms with examples."
              >
                <span class="suggestion-icon">
                  <i class="fa-solid fa-lightbulb" aria-hidden="true"></i>
                </span>
                <span>
                  <strong>Explain something</strong>
                  Get a simple explanation with useful examples.
                </span>
              </button>
            </div>
          </div>
        </div>

        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-shell">
        <form class="composer" id="chatForm">
          <div class="input-container">
            <textarea
              id="messageInput"
              rows="1"
              maxlength="12000"
              placeholder="Message GrieezBot..."
              aria-label="Message GrieezBot"
            ></textarea>

            <button
              class="send-button"
              id="sendButton"
              type="submit"
              aria-label="Send message"
              disabled
            >
              <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
            </button>
          </div>

          <p class="disclaimer">GrieezBot can make mistakes.</p>
        </form>
      </div>
    </main>
  </div>

  <script src="/script.js" defer></script>
</body>
</html>
